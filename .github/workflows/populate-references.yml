name: Populate references
# When a PR adds or changes a problem file: assign its permanent ID (HM-NEXT → next free
# number) and date deterministically, then run Claude to assign tags and generate a
# summary for any cited paper that lacks one, and commit it all to the PR branch.
# Procedure: docs/problem-processing.md.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'problems/**.md'

permissions:
  contents: write
  pull-requests: read
  id-token: write   # required by anthropics/claude-code-action for OIDC token exchange

jobs:
  populate:
    # Same-repo branches only — fork PRs cannot read the OAuth-token secret.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: List changed problem files
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          files=$(gh pr diff "$PR_URL" --name-only \
            | grep -E '^problems/.*\.md$' \
            | grep -vE '^problems/(README|TEMPLATE)\.md$' || true)
          echo "$files"
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          [ -n "$files" ] && echo "any=true" >> "$GITHUB_OUTPUT" || echo "any=false" >> "$GITHUB_OUTPUT"

      - name: Assign IDs and stamp dates (deterministic)
        id: normalize
        if: steps.changed.outputs.any == 'true'
        run: |
          today=$(date -u +%F)
          # Highest existing HM number among committed problems (HM-NEXT files excluded).
          max=$(ls problems 2>/dev/null | sed -nE 's/^HM-([0-9]+)-.*/\1/p' | sort -n | tail -1)
          n=$((10#${max:-0}))
          out=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              problems/HM-NEXT-*)
                n=$((n + 1))
                id=$(printf 'HM-%03d' "$n")
                newf="problems/${id}-${f#problems/HM-NEXT-}"
                git mv "$f" "$newf"
                sed -i "s/HM-NEXT/${id}/g" "$newf"
                f="$newf"
                ;;
            esac
            sed -i "s/added: YYYY-MM-DD/added: ${today}/" "$f"
            out="${out}${f}"$'\n'
          done <<< "${{ steps.changed.outputs.files }}"
          {
            echo "files<<EOF"
            printf '%s' "$out"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Assign tags and populate references with Claude
        if: steps.changed.outputs.any == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Use the workflow's built-in token so the action skips the Claude GitHub App
          # token exchange (we do our own commit/push in a later step).
          github_token: ${{ github.token }}
          prompt: |
            Finish these problem PR file(s) (IDs and dates are already assigned — do NOT
            change them), following docs/problem-processing.md:
            ${{ steps.normalize.outputs.files }}

            Do ALL of the following, in order:
            1. Tags: if the `tags:` field is `<auto>`, replace it with 1-3 tags taken only
               from problems/TAGS.md that fit the problem.
            2. Reference files: the `## References` section is a numbered list of
               `[N] <url>` lines. For each URL, determine the paper's firstauthor+year key
               (e.g. richens2024); if references/<key>.md does not already exist, fetch the
               source and write it per references/TEMPLATE.md (title, `*Authors:*`,
               `*Link:*`, `## Summary`). Summaries must be faithful — never fabricate; if a
               URL truly cannot be retrieved, say so in your final message.
            3. Convert citations IN THE PROBLEM FILE (this is the step most easily missed —
               do not skip it): replace every inline numeric marker (`[1]`, `[2, 3]`, …)
               with the matching author-year link(s) `[[key]](../references/key.md)`
               (comma-separate groups), and rewrite the `## References` list into keyed
               bullets `- [[key]](../references/key.md) — Author(s), *Title*, Venue Year. <url>`.
               NO `[N]` markers or bare `[N] <url>` lines may remain anywhere.
            4. Update the index tables in problems/README.md and references/README.md.
            5. Definition of done: run `python3 scripts/check_references.py` AND
               `python3 scripts/check_problems.py`, fix whatever they report, and repeat
               until BOTH print "OK". Do not finish while either still errors.

            Do not change the substance of the problem statement or resources. Do NOT
            commit or push — just leave the changes in the working tree.
          claude_args: |
            --allowedTools Read,Write,Edit,Glob,Grep,WebFetch,Bash
            --max-turns 60

      - name: Commit generated changes to the PR branch
        if: steps.changed.outputs.any == 'true'
        run: |
          git config user.name "hivemind-bot"
          git config user.email "hivemind-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Auto-assign IDs, tags, and reference summaries"
            git push origin "HEAD:${{ github.head_ref }}"
          else
            echo "Nothing to commit."
          fi

      - name: Validate problems and references
        if: steps.changed.outputs.any == 'true'
        run: |
          python3 scripts/check_references.py
          python3 scripts/check_problems.py
