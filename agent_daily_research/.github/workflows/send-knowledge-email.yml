name: Email knowledge updates
# Fires only for HUMAN-driven merges: merges performed by the auto-merge
# workflow use GITHUB_TOKEN, whose events never start workflow runs — that
# path emails from within auto-merge-knowledge.yml instead. No double-send.
on:
  pull_request:
    types: [closed]
permissions:
  contents: read
  pull-requests: read
jobs:
  email:
    if: github.event.pull_request.merged == true && startsWith(github.head_ref, 'claude/knowledge-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # Keep this step's run block in sync with auto-merge-knowledge.yml.
      - name: Email the briefing (skipped unless email secrets are configured)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          KNOWLEDGE_EMAIL_TO: ${{ secrets.KNOWLEDGE_EMAIL_TO }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [ -z "$GMAIL_APP_PASSWORD" ]; then
            echo "::notice::Email not configured (no GMAIL_APP_PASSWORD secret) — skipping. See docs/email-setup.md."
            exit 0
          fi
          files=$(gh pr diff "$PR_URL" --name-only | grep -E '^KNOWLEDGE/(daily|fortnightly)/.*\.md$' || true)
          if [ -z "$files" ]; then
            echo "::notice::No daily/fortnightly file in this PR — nothing to email."
            exit 0
          fi
          for f in $files; do
            python3 scripts/send_email.py "$f" --link "https://github.com/$GITHUB_REPOSITORY/blob/main/$f"
          done
