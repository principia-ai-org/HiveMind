name: Auto-merge knowledge updates
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
  pull-requests: write
jobs:
  automerge:
    if: startsWith(github.head_ref, 'claude/knowledge-')
    runs-on: ubuntu-latest
    steps:
      - name: Merge only if the PR touches nothing outside KNOWLEDGE/ and .recyclebin/
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          files=$(gh pr diff "$PR_URL" --name-only)
          echo "$files"
          bad=$(echo "$files" | grep -vE '^(KNOWLEDGE/|\.recyclebin/)' || true)
          if [ -n "$bad" ]; then
            echo "::notice::Not auto-merging — PR touches files outside KNOWLEDGE/ and .recyclebin/. Merge manually if intended."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh pr merge "$PR_URL" --squash --delete-branch
          echo "merged=true" >> "$GITHUB_OUTPUT"
      - name: Check out merged main
        if: steps.merge.outputs.merged == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
      # Keep this step's run block in sync with send-knowledge-email.yml.
      - name: Email the briefing (skipped unless email secrets are configured)
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          KNOWLEDGE_EMAIL_TO: ${{ secrets.KNOWLEDGE_EMAIL_TO }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [ -z "$GMAIL_APP_PASSWORD" ]; then
            echo "::notice::Email not configured (no GMAIL_APP_PASSWORD secret) — skipping. See docs/email-setup.md."
            exit 0
          fi
          files=$(gh pr diff "$PR_URL" --name-only | grep -E '^KNOWLEDGE/(daily|fortnightly)/.*\.md$' || true)
          if [ -z "$files" ]; then
            echo "::notice::No daily/fortnightly file in this PR — nothing to email."
            exit 0
          fi
          for f in $files; do
            python3 scripts/send_email.py "$f" --link "https://github.com/$GITHUB_REPOSITORY/blob/main/$f"
          done
