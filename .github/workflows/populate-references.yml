name: Populate references
# When a PR adds or changes a problem file: assign its permanent ID (HM-NEXT → next free
# number) and date deterministically, then run Claude to assign tags and generate a
# summary for any cited paper that lacks one, and commit it all to the PR branch.
# Procedure: docs/problem-processing.md.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'problems/**.md'

permissions:
  contents: write
  pull-requests: read
  id-token: write   # required by anthropics/claude-code-action for OIDC token exchange

jobs:
  populate:
    # Same-repo branches only — fork PRs cannot read the OAuth-token secret.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: List changed problem files
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          files=$(gh pr diff "$PR_URL" --name-only \
            | grep -E '^problems/.*\.md$' \
            | grep -vE '^problems/(README|TEMPLATE)\.md$' || true)
          echo "$files"
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          [ -n "$files" ] && echo "any=true" >> "$GITHUB_OUTPUT" || echo "any=false" >> "$GITHUB_OUTPUT"

      - name: Assign IDs and stamp dates (deterministic)
        id: normalize
        if: steps.changed.outputs.any == 'true'
        run: |
          today=$(date -u +%F)
          # Highest existing HM number among committed problems (HM-NEXT files excluded).
          max=$(ls problems 2>/dev/null | sed -nE 's/^HM-([0-9]+)-.*/\1/p' | sort -n | tail -1)
          n=$((10#${max:-0}))
          out=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              problems/HM-NEXT-*)
                n=$((n + 1))
                id=$(printf 'HM-%03d' "$n")
                newf="problems/${id}-${f#problems/HM-NEXT-}"
                git mv "$f" "$newf"
                sed -i "s/HM-NEXT/${id}/g" "$newf"
                f="$newf"
                ;;
            esac
            sed -i "s/added: YYYY-MM-DD/added: ${today}/" "$f"
            out="${out}${f}"$'\n'
          done <<< "${{ steps.changed.outputs.files }}"
          {
            echo "files<<EOF"
            printf '%s' "$out"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Assign tags and populate references with Claude
        if: steps.changed.outputs.any == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Use the workflow's built-in token so the action skips the Claude GitHub App
          # token exchange (we do our own commit/push in a later step).
          github_token: ${{ github.token }}
          prompt: |
            Follow the procedure in docs/problem-processing.md for these changed problem
            files (IDs and dates are already assigned; do not change them):
            ${{ steps.normalize.outputs.files }}

            That means, following docs/problem-processing.md:
            - assign tags from problems/TAGS.md if the tags are the `<auto>` placeholder;
            - resolve the numbered references (each `[N] <url>` line under `## References`),
              generate a summary file for any cited paper that lacks one, convert the
              inline numeric citations (`[1]`, `[2, 3]`) into author-year links
              `[[key]](../references/key.md)`, and rewrite the `## References` list into
              keyed bullets (no numbered markers should remain);
            - keep the problems/README.md and references/README.md index tables correct.
            Do not change the substance of the problem statement or resources — only the
            `tags:` field, the citation markers and reference list, files under
            references/, and the two index tables. Do NOT commit or push — leave changes
            in the working tree and make both `python3 scripts/check_references.py` and
            `python3 scripts/check_problems.py` pass.
          claude_args: |
            --allowedTools Read,Write,Edit,Glob,Grep,WebFetch,Bash

      - name: Commit generated changes to the PR branch
        if: steps.changed.outputs.any == 'true'
        run: |
          git config user.name "hivemind-bot"
          git config user.email "hivemind-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Auto-assign IDs, tags, and reference summaries"
            git push origin "HEAD:${{ github.head_ref }}"
          else
            echo "Nothing to commit."
          fi

      - name: Validate problems and references
        if: steps.changed.outputs.any == 'true'
        run: |
          python3 scripts/check_references.py
          python3 scripts/check_problems.py
